name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The Linux tests start their own X server and session bus for the
      # hotkeys, the save key and the notifications.
      - name: Install Xvfb and D-Bus
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb dbus

      - run: go vet ./...

      - run: go test ./...

      # A tag v1.2.3 builds version 1.2.3; the in-app updater looks for the
      # files by name: romod-<GOOS>-<GOARCH>[.exe].
      - name: Build
        shell: bash
        run: |
          export VERSION=dev
          [ "$GITHUB_REF_TYPE" = tag ] && VERSION=${GITHUB_REF_NAME#v}
          case "$RUNNER_OS" in
            Windows)
              go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$VERSION" -o dist/romod-windows-amd64.exe ./cmd/romod ;;
            macOS)
              scripts/macos-app.sh
              tar -czf dist/romod-macos.tar.gz -C dist roMod.app ;;
            Linux)
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o dist/romod-linux-amd64 ./cmd/romod ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: romod-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.tar.gz
            dist/romod-linux-*

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
