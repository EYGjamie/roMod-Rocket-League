<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>roMod</title>
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
<script type="module" src="/assets/app.js"></script>
</head>
<body>
<div id="app">
  <nav id="nav" aria-label="Bereiche">
    <img class="logo" src="/assets/icon.svg" alt="" width="28" height="28">
    <a href="#/uebersicht" data-route="uebersicht" aria-label="Übersicht" title="Übersicht"><i class="ph ph-house"></i><span class="ping" data-dot="failed" hidden></span></a>
    <a href="#/verlauf" data-route="verlauf" aria-label="Verlauf" title="Verlauf"><i class="ph ph-list-bullets"></i><span class="ping" data-dot="unsorted" hidden></span></a>
    <a href="#/ordner" data-route="ordner" aria-label="Ordner" title="Ordner"><i class="ph ph-folder"></i></a>
    <a href="#/statistik" data-route="statistik" aria-label="Statistik" title="Statistik"><i class="ph ph-chart-bar"></i></a>
    <a href="#/regeln" data-route="regeln" aria-label="Regeln" title="Regeln"><i class="ph ph-git-branch"></i></a>
    <a class="gear" href="#/einstellungen" data-route="einstellungen" aria-label="Einstellungen" title="Einstellungen"><i class="ph ph-gear-six"></i><span class="ping" data-dot="setup" hidden></span></a>
    <button id="close" hidden aria-label="Overlay schließen" title="Schließen (Esc)"><i class="ph ph-x"></i></button>
  </nav>
  <main id="view" tabindex="-1"></main>
  <footer id="foot"></footer>
</div>
<div id="flash" role="status" aria-live="polite"></div>
<div id="drop" hidden><div>Replays hier ablegen zum Hochladen</div></div>
</body>
</html>
